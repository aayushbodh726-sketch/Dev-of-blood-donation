name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  API_BASE_URL: ${{ vars.API_BASE_URL || 'https://ambpqrztnvgthgrmqbse.supabase.co/functions/v1/lifeflow-api' }}
  SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_uXobz_BlIXYQECoftPsqCA_TUC2H82J' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies and build
        run: |
          if [ -d "client" ] && [ -f "client/package.json" ]; then
            echo "Building from client directory with base=./ ..."
            cd client
            npm install
            npm run build -- --base=./
            cd ..
            mkdir -p public_dist
            cp -r client/dist/* public_dist/
            cp public_dist/index.html public_dist/404.html
          else
            echo "Building from root directory with base=./ ..."
            npm install
            npm run build -- --base=./
            mkdir -p public_dist
            cp -r dist/* public_dist/
            cp public_dist/index.html public_dist/404.html
          fi
        env:
          VITE_API_BASE_URL: ${{ env.API_BASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ env.SUPABASE_PUBLISHABLE_KEY }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public_dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
